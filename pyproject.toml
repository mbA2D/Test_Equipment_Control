[build-system]
requires = ["setuptools>=80.9,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "test_equipment_control"
version = "0.1.0"
description = "Control and automate lab test equipment"
readme = "docs/README.md"
license = {file = "LICENSE"}
requires-python = ">=3.14,<3.15"
dependencies = [
  "PyQt6==6.11.0",
  "PyQt6-Qt6==6.11.2",
  "PyQt6-sip==13.12.0",
  "numpy==2.5.3",
  "pandas==3.0.6",
  "scipy==1.18.1",
  "matplotlib==3.11.2",
  "PyVISA==1.16.2",
  "PyVISA-py==0.8.1",
  "keyboard==0.13.5",
  "retry==0.9.2",
]

[project.optional-dependencies]
legacy-hardware-ui = [
  "easygui==0.98.3",
]
hardware = [
  "gpib-ctypes==0.3.0",
  "hidapi==0.15.0",
  "pyserial==3.5",
  "pyusb==1.3.1",
]
analysis = [
  "batterydf==0.1.0",
]
dev = [
  "pytest==9.1.1",
  "pytest-qt==4.5.0",
  "ruff==0.16.8",
  "mypy==2.3.1",
]

[tool.setuptools]
packages = ["battery_app", "battery_gui", "charge_discharge", "lab_equipment"]

[tool.setuptools.package-data]
lab_equipment = ["A2D_DAQ_Config_*.csv"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "hardware: tests that require physical lab instruments",
]

[tool.ruff]
line-length = 120
target-version = "py314"




